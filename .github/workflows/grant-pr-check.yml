name: Grant fork PR check

# Runs the same checks as "Grant fork sync from jayleaton" on pull requests to main.
# The CI workflow asks for Blacksmith runners, which this repository does not have, so
# its jobs never start here. This job uses a standard GitHub runner.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: grant-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Grant checks
    if: github.repository == 'GrantCharge/ada'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb
        with:
          node-version-file: package.json
          run-install: false

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: vp install --frozen-lockfile

      - name: Install Electron before parallel tests
        working-directory: apps/desktop
        run: node -e "require('electron')"

      - name: Install Chromium for web browser tests
        run: |
          node apps/web/node_modules/playwright/cli.js install --only-shell chromium
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Run jayleaton's release checks
        run: scripts/fork-release-validate.sh

      - name: Run Grant's feature checks
        run: |
          NODE_ENV=test vp test run \
            apps/server/src/orchestration-v2/ResponseStyle.test.ts \
            packages/provider-core/src/server/textGenerationOperations.test.ts
          vp run --filter @t3tools/server --filter @t3tools/provider-core typecheck
